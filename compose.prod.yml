# Coolify/Traefik termina TLS. Ningún servicio publica puertos al host.
x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  gateway:
    <<: *hardening
    image: ${IMAGE_PREFIX:?Define IMAGE_PREFIX}-gateway:${IMAGE_TAG:-main}
    mem_limit: 64m
    cpus: 0.25
    environment:
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:?Define TRUSTED_PROXY_CIDR}
      UMAMI_SCRIPT_URL: ${UMAMI_SCRIPT_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    depends_on:
      web: {condition: service_healthy}
      api: {condition: service_healthy}
      admin: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [frontend]
  web:
    <<: *hardening
    image: ${IMAGE_PREFIX:?Define IMAGE_PREFIX}-web:${IMAGE_TAG:-main}
    mem_limit: 256m
    cpus: 0.5
    environment:
      SITE_URL: ${SITE_URL:?Define SITE_URL}
      API_URL: http://api:3001
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [frontend]
  api:
    <<: *hardening
    image: ${IMAGE_PREFIX:?Define IMAGE_PREFIX}-api:${IMAGE_TAG:-main}
    mem_limit: 384m
    cpus: 0.75
    stop_grace_period: 10s
    environment:
      SITE_URL: ${SITE_URL:?Define SITE_URL}
      POSTGRES_HOST: postgres
      POSTGRES_DB: app
      POSTGRES_APP_USER: ofertas_app
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Define APP_DATABASE_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:?Define SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?Define MAIL_FROM}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:3001/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [frontend, backend]
  admin:
    <<: *hardening
    image: ${IMAGE_PREFIX:?Define IMAGE_PREFIX}-admin:${IMAGE_TAG:-main}
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [frontend]
  postgres:
    <<: *hardening
    image: ${IMAGE_PREFIX:?Define IMAGE_PREFIX}-postgres:${IMAGE_TAG:-main}
    cap_add: [CHOWN, DAC_READ_SEARCH, SETGID, SETUID]
    tmpfs: [/tmp, /var/run/postgresql]
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Define APP_DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d app"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]
volumes:
  postgres-data:
networks:
  frontend:
  backend:
    internal: true
