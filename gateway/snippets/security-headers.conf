# Cabeceras de seguridad de las páginas. Se incluyen en cada `location` que sirve
# HTML: en nginx un `add_header` dentro de una location anula los heredados.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self 'https://js.stripe.com')" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Los scripts en línea (hidratación de React Router) llevan como nonce el X-Request-ID que el
# gateway genera y pasa a la app (proxy-headers.conf): aleatorio por petición y no elegible por el cliente.
# Todo se sirve desde el propio dominio. Si la app carga recursos de terceros
# (fuentes, mapas, pagos), añadir aquí su origen.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'$analytics_src https://js.stripe.com; frame-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'$analytics_src https://api.stripe.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com; object-src 'none'" always;
