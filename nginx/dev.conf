resolver 127.0.0.11 valid=5s ipv6=off;
upstream dev_web { zone dev_web 64k; server web:3000 resolve; }
upstream dev_api { zone dev_api 64k; server api:3001 resolve; }
upstream dev_admin { zone dev_admin 64k; server admin:8081 resolve; }
server {
    listen 8080;
    server_name localhost;
    client_max_body_size 1m;
    location = /admin { return 302 /admin/; }
    location /admin/ { proxy_pass http://dev_admin; }
    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://dev_api;
    }
    location /ir/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://dev_api;
    }
    location / {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_pass http://dev_web;
    }
}
